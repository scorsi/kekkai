[package]
name = "kekkai-fuzz"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[package.metadata]
cargo-fuzz = true

# Dependency policy: ADR 0020 names cargo-fuzz; ADR 0028 records libfuzzer-sys.
[dependencies]
kekkai-core = { path = "../crates/kekkai-core" }
kekkai-io = { path = "../crates/kekkai-io" }
libfuzzer-sys = "0.4"

[[bin]]
name = "outer_header"
path = "fuzz_targets/outer_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tlv_list"
path = "fuzz_targets/tlv_list.rs"
test = false
doc = false
bench = false

[[bin]]
name = "inner_message"
path = "fuzz_targets/inner_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "node_config"
path = "fuzz_targets/node_config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "firewall"
path = "fuzz_targets/firewall.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lighthouse_config"
path = "fuzz_targets/lighthouse_config.rs"
test = false
doc = false
bench = false
