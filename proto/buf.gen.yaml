version: v2
plugins:
  # Go client, consumed by apps/cli (0015).
  - local: protoc-gen-go
    out: ../apps/cli/internal/genproto
    opt: paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../apps/cli/internal/genproto
    opt: paths=source_relative
# The Rust server code is generated at build time by crates/kekkai-control/build.rs, not here (0023).
