syntax = "proto3";

package kekkai.control.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/scorsi/kekkai/cli/internal/genproto/kekkai/control/v1;controlv1";

// Control API served by the node, the lighthouse and the relay over a Unix socket (0015,
// 0030, 0031).
service ControlService {
  // The daemon's state; `kekkai status --json` prints the reply in protojson form.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
}

message GetStatusRequest {}

// A node fills node, peers, firewall, lighthouses and relays; a lighthouse fills node (its
// own key, version and port) and registrations; a relay fills node and senders.
message GetStatusResponse {
  NodeStatus node = 1;
  repeated PeerStatus peers = 2;
  FirewallStatus firewall = 3;
  repeated LighthouseStatus lighthouses = 4;
  repeated Registration registrations = 5;
  repeated RelayStatus relays = 6;
  repeated RelaySender senders = 7;
}

// State of a session with a lighthouse or relay (0015).
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_CONNECTED = 1;
  SESSION_STATE_HANDSHAKING = 2;
  SESSION_STATE_DOWN = 3;
}

// The node's view of one configured lighthouse (spec section 13.1).
message LighthouseStatus {
  string public_key = 1;
  // The configured endpoint, as written.
  string endpoint = 2;
  SessionState state = 3;
  // Unset until a handshake completed.
  google.protobuf.Timestamp last_handshake = 4;
  // Last authenticated packet (keepalive or answer) from the lighthouse.
  google.protobuf.Timestamp last_received = 5;
}

// The node's view of one configured relay (spec section 14.1).
message RelayStatus {
  string public_key = 1;
  // The configured endpoint, as written.
  string endpoint = 2;
  SessionState state = 3;
  // Unset until a handshake completed.
  google.protobuf.Timestamp last_handshake = 4;
  // Last authenticated packet (keepalive or forwarded packet) from the relay.
  google.protobuf.Timestamp last_received = 5;
}

// What a relay counts for one listed node as a sender (spec section 14.2).
message RelaySender {
  string public_key = 1;
  // The name the relay's configuration gives the key.
  string name = 2;
  // The relay holds a live session with this node.
  bool connected = 3;
  // relay_forward messages forwarded, and their payload bytes.
  uint64 forwarded_packets = 4;
  uint64 forwarded_bytes = 5;
  // Dropped: destination unlisted or not connected.
  uint64 dropped_no_route = 6;
  // Dropped: over the per-sender rate limit.
  uint64 dropped_rate_limited = 7;
}

// One unexpired registration held by a lighthouse (spec section 13.2).
message Registration {
  string public_key = 1;
  // The name the lighthouse's configuration gives the key.
  string name = 2;
  // Source of the last register (`host:port`).
  string observed_endpoint = 3;
  repeated string local_endpoints = 4;
  // Time since the last register.
  google.protobuf.Duration last_seen = 5;
}

// The inbound firewall's table of UDP flows and fragments (0011, spec section 15).
message FirewallStatus {
  uint64 udp_flows = 1;
  uint64 udp_flows_max = 2;
  // Entries evicted because the table was full.
  uint64 evictions = 3;
}

message NodeStatus {
  // Standard base64 (spec section 4).
  string public_key = 1;
  // Overlay addresses with their prefix length.
  repeated string addresses = 2;
  string version = 3;
  uint32 wire_version = 4;
  google.protobuf.Duration uptime = 5;
  uint32 listen_port = 6;
}

// How a peer is reached (0013, spec section 12.1).
enum Path {
  PATH_UNSPECIFIED = 0;
  // No live session.
  PATH_NONE = 1;
  PATH_DIRECT = 2;
  PATH_RELAYED = 3;
}

// Reason of the last direct-path failure (spec section 12.6).
enum DirectPathFailure {
  DIRECT_PATH_FAILURE_UNSPECIFIED = 0;
  DIRECT_PATH_FAILURE_NO_CANDIDATES = 1;
  DIRECT_PATH_FAILURE_TIMEOUT = 2;
  DIRECT_PATH_FAILURE_ABANDONED = 3;
  DIRECT_PATH_FAILURE_LIGHTHOUSE_UNKNOWN = 4;
}

message PeerStatus {
  string public_key = 1;
  repeated string addresses = 2;
  Path path = 3;
  // Public key of the relay when `path` is `PATH_RELAYED`.
  string relay_public_key = 4;
  // Current endpoint (`host:port`), empty when none is known.
  string endpoint = 5;
  // Unset until a handshake completed.
  google.protobuf.Timestamp last_handshake = 6;
  uint64 rx_bytes = 7;
  uint64 tx_bytes = 8;
  uint64 rx_packets = 9;
  uint64 tx_packets = 10;
  uint64 replay_rejections = 11;
  // Unspecified when no direct path failed yet.
  DirectPathFailure last_direct_path_failure = 12;
  // The peer's `allow_inbound` rules as configured (0011).
  repeated string allow_inbound = 13;
  // Packets from this peer refused by the inbound firewall (spec section 15).
  uint64 firewall_drops = 14;
  // The name this node's configuration gives the peer; a local label, never sent over the
  // overlay (identity is the public key until v1 certificates, 0027).
  string name = 15;
  // Local index of the `current` session (spec section 7.5), the `receiver_index` the peer
  // puts in its packets to this node; unset without one. Unchanged by a reload that keeps
  // the peer (spec section 4.1).
  optional uint32 receiver_index = 16;
  // When the `current` session, the one `receiver_index` names, was created (spec section
  // 8.1): its age drives the rekeys (section 8.6). Unset without one. `last_handshake` can
  // be a newer, not yet confirmed session.
  google.protobuf.Timestamp session_created = 17;
}
