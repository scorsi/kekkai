name: check
on: [push, pull_request]

jobs:
  linux:
    runs-on: linux
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: nix fmt -- --ci
      - run: nix develop -c sh -c 'cd proto && buf lint'
      - run: nix flake check -L

  macos:
    runs-on: macos
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
      - run: nix build -L .#kekkai-node .#kekkai-lighthouse .#kekkai-relay .#kekkai
      - run: nix build -L .#checks.aarch64-darwin.modules-eval
