[package]
name = "kekkai-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

# Dependency policy: ADR 0003 (snow and the RustCrypto glue crates), ADR 0028 (the rest,
# and its 2026-10-21 amendment for the resolver crates; ADR 0034 and the 0028 amendment of
# 2026-10-29 for ed25519-dalek, without `legacy_compatibility`, spec §4.3 step 5).
[dependencies]
snow = { version = "0.10", features = ["risky-raw-split"] }
curve25519-dalek = { version = "4.1.3", default-features = false }
blake2 = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast", "zeroize"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
